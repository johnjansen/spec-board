[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-board"
version = "0.1.0"
description = "Web-based visualization dashboard for spec-kit artifacts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "pygments>=2.19.2",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
spec-board = "src.__main__:main"

[tool.setuptools]
packages = ["src", "src.models", "src.services", "src.web"]

[tool.setuptools.package-data]
src = ["templates/**/*.html", "static/**/*"]
